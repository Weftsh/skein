# Skein, PostgreSQL and MinIO on one machine.
#
#   cp .env.example .env        # and set the two passwords in it
#   docker compose up -d --build --wait
#   docker compose exec skein skein admin bootstrap --org <your-org>
#
# In a checkout this builds the image from the source beside it; the
# copy in a release's skein-compose-<version>.tar.gz runs that release's
# published image instead, with nothing to build (scripts/bundle.sh).
#
# then open http://localhost:8080 and sign in with the password it
# printed. The passwords have no defaults on purpose: a stack that comes
# up with a password everybody can read in this file is one that ships
# to production with it. For production, put TLS in front of port 8080
# and set SKEIN_PUBLIC_URL to the https:// address people use — see
# docs/operations.md and deploy/nginx.conf.

services:
  skein:
    build: .
    image: ${SKEIN_IMAGE:-skein:local}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SKEIN_DB_URL: postgres://skein:${SKEIN_DB_PASSWORD:?set SKEIN_DB_PASSWORD in .env (see .env.example)}@postgres:5432/skein
      SKEIN_STORE_URL: http://minio:9000/skein
      SKEIN_STORE_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: skein
      AWS_SECRET_ACCESS_KEY: ${SKEIN_STORE_PASSWORD:?set SKEIN_STORE_PASSWORD in .env (see .env.example)}
      AWS_REGION: us-east-1
      SKEIN_PUBLIC_URL: ${SKEIN_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: skein
      POSTGRES_PASSWORD: ${SKEIN_DB_PASSWORD:?set SKEIN_DB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: skein
    ports:
      - "127.0.0.1:${SKEIN_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skein"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A byte-for-byte copy of quay.io/minio/minio at a pinned release, from
  # github.com/weftsh/minio-mirror: MinIO no longer publishes images to
  # Docker Hub, and quay.io refuses anonymous pulls from some networks.
  minio:
    image: ghcr.io/weftsh/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --address :9000
    environment:
      MINIO_ROOT_USER: skein
      MINIO_ROOT_PASSWORD: ${SKEIN_STORE_PASSWORD:?set SKEIN_STORE_PASSWORD in .env (see .env.example)}
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:${SKEIN_MINIO_PORT:-9000}:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  miniodata:
