[package]
name = "skein-control"
description = "Skein's control plane: packages, versions, admission policy, people, tokens and sessions in PostgreSQL"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
postgres.workspace = true
skein-tls.workspace = true
# TLS to PostgreSQL, on the same rustls and ring as every other
# connection Skein makes.
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
sha2.workspace = true
argon2.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
skein-testkit.workspace = true
