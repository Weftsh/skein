[package]
name = "skein-tls"
description = "The certificates Skein trusts: public roots, the OS store, and the operator's own CA"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# ring, not aws-lc-rs: pure Rust and C with no cmake, so the release's
# static musl build keeps working. The same provider ureq already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
ureq.workspace = true

[dev-dependencies]
rcgen = "0.14"
