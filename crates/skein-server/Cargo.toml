[package]
name = "skein-server"
description = "Skein: a self-hosted package registry for npm, Maven, PyPI, Cargo and OCI images"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "skein"
path = "src/main.rs"

[dependencies]
skein-store.workspace = true
skein-control.workspace = true
skein-license.workspace = true
axum = "0.7"
# Only for `hyper::ext::ReasonPhrase`: Maven, twine and pip show a person
# the status line of a refusal and never its body, so those doors write
# their sentence there. axum already builds hyper with `http1`; this only
# names the type.
hyper = { version = "1", default-features = false, features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
flate2.workspace = true
ureq.workspace = true
libc.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
skein-testkit.workspace = true
skein-license = { workspace = true, features = ["issue"] }
postgres.workspace = true
ureq.workspace = true
