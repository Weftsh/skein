# nginx in front of Skein: TLS, and nothing in the way of a package.
#
# Used by compose.tls.yml; also a starting point for an nginx you run
# yourself. Put your certificate and key in the directory mounted at
# /etc/nginx/tls, as skein.crt and skein.key, and set SKEIN_PUBLIC_URL to
# the https:// address this answers on.

events {}

http {
    # A package arrives as one request body: a container layer can be
    # gigabytes, a Maven artifact or an npm tarball tens of megabytes.
    # nginx's default of 1 MiB refuses the first real publish with a
    # 413. Skein enforces its own limit per ecosystem, so none here.
    client_max_body_size 0;
    # Stream bodies through, both ways, instead of spooling them to disk
    # first: a multi-gigabyte layer should not need that much free disk
    # on the proxy, and a client's progress bar should mean something.
    proxy_request_buffering off;
    proxy_buffering off;
    # A slow client pushing a large layer is not a dead one.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    # HTTP/1.1 to Skein, so chunked uploads (docker, twine) pass through.
    proxy_http_version 1.1;

    server {
        listen 443 ssl;
        # HTTP/2 stays off: Maven, twine and pip print the reason phrase
        # of a refusal — "rita is a reader here, and a reader may not
        # publish…" — and HTTP/2 has no reason phrase to carry it.
        ssl_certificate     /etc/nginx/tls/skein.crt;
        ssl_certificate_key /etc/nginx/tls/skein.key;

        location / {
            proxy_pass http://skein:8080;
            # The name the client used. Skein writes its own public URL
            # into what it hands out regardless, so this is for the logs.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }
}
